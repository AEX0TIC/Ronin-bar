# Writes "What's new" from docs/release-notes/v<version>.md into every published release, keeping
# each release's SHA-256. Run it from Actions → release-notes → Run workflow (on main) after
# editing the notes. New releases get their notes from the release workflow by themselves.
name: release-notes
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Update release notes
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          set -eu
          for f in docs/release-notes/v*.md; do
            tag=$(basename "$f" .md); v=${tag#v}
            gh release view "$tag" >/dev/null 2>&1 || { echo "$tag: not released, skipped"; continue; }
            sha=$(gh release view "$tag" --json body -q .body | grep -m1 '^SHA-256:' || true)
            auto=""
            if [ "$(printf '%s\n0.5.1\n' "$v" | sort -V | head -n1)" = "0.5.1" ]; then auto=" Already running Ronin Bar 0.5 or newer? It offers this update by itself."; fi
            { cat "$f"; printf '\nDownload **Ronin-Bar-%s.exe** and run it: it asks once, then installs itself into one folder.%s\n\nUninstall from Settings → Apps → Ronin Bar.\n\n%s\n' "$v" "$auto" "$sha"; } > body.md
            gh release edit "$tag" --notes-file body.md
            echo "$tag: updated"
          done
