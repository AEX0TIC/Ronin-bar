# Publish a release: Actions → release → Run workflow (on main). Running it again for the same
# version replaces that release's files with a fresh build.
# Builds ronin-bar.exe on Windows and publishes it with its SHA-256 as v<version from Cargo.toml>.
name: release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: Test and build
        run: |
          cargo test --locked --workspace
          cargo build --locked --release -p ronin-bar
      - name: Publish
        shell: pwsh
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(\d+\.\d+\.\d+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/ronin-bar.exe "dist/Ronin-Bar-$v.exe"
          $h = (Get-FileHash "dist/Ronin-Bar-$v.exe" -Algorithm SHA256).Hash.ToLower()
          "$h  Ronin-Bar-$v.exe" | Out-File "dist/Ronin-Bar-$v.exe.sha256" -Encoding ascii -NoNewline
          # What's new comes from docs/release-notes/v<version>.md (shown on GitHub and in the bar's update popup).
          $new = if (Test-Path "docs/release-notes/v$v.md") { (Get-Content "docs/release-notes/v$v.md" -Raw).Trim() + "`n`n" } else { "" }
          $notes = "$new" + "Download **Ronin-Bar-$v.exe** and run it: it asks once, then installs itself into one folder. Already running Ronin Bar 0.5 or newer? It offers this update by itself.`n`nUninstall from Settings → Apps → Ronin Bar.`n`nSHA-256: ``$h``"
          # A version that is already released gets its files replaced (same version, newer build).
          gh release view "v$v" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "v$v" dist/* --clobber
            gh release edit "v$v" --notes "$notes"
          } else {
            gh release create "v$v" dist/* --title "Ronin Bar $v" --notes $notes --target $env:GITHUB_SHA
          }
