[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]
# The app needs a GPU window; `cargo test` on any OS builds only the core.
default-members = ["crates/core"]

[workspace.package]
version = "0.12.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/AEX0TIC/Ronin-bar"
rust-version = "1.87"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
