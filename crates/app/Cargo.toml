[package]
name = "ronin-bar"
description = "Ronin Bar: a smart dock for the top of the Windows screen: pinned apps, open windows, working controls, anime wallpapers and themes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "ronin-bar"
path = "src/main.rs"

[dependencies]
ronin-core = { path = "../core" }
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
egui_extras = { version = "0.37", default-features = false, features = ["image", "file"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ureq = { version = "3", default-features = false, features = ["native-tls"] }
winreg = "0.55"
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com",
  "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Power", "Win32_System_SystemInformation",
  "Win32_System_Threading", "Win32_Security", "Win32_System_Shutdown", "Win32_Networking_NetworkListManager",
  "Win32_Graphics_Gdi", "Win32_System_Com_StructuredStorage", "Win32_UI_HiDpi", "Win32_System_Variant", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem",
] }
